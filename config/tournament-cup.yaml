# DORMANT since 2026-09-10 — withdrawn from the Metaculus Cup, owner decision.
#
# This file is kept, not deleted, so the entry can be resumed. It is inert on its own: the
# `whiskeyjack-tournament-cup.timer` is stopped and disabled, and `tournament disable` has
# appended a `disabled` event to this profile's ledger, so `tournament run-once --config`
# against it refuses. Editing this file cannot re-enter the tournament.
#
# To resume: `tournament enable --config config/tournament-cup.yaml --project-id 33108
# --starts <UTC ISO, predating the open questions> --ends <UTC ISO> --budget-usd <N>`, then
# `systemctl --user enable --now whiskeyjack-tournament-cup.timer`. See docs/M1-NOTES.md
# "Metaculus Cup Fall 2026 — withdrawn" for the state at withdrawal and the reasoning.
#
# Explicit activation in SQLite is required. Committing this profile does not activate it.
#
# Second tournament target: Metaculus Cup Fall 2026 (with Kiko Llaneras).
# https://www.metaculus.com/notebooks/45384/announcing-the-metaculus-cup-fall-2026-with-kiko-llaneras/
# Bots may forecast via the API but are not prize-eligible in the Metaculus Cup -- fine for
# whiskeyjack's purpose (the attribution instrument), just worth the owner knowing.
#
# tournament.id below is the verified numeric project ID (read out of a live question's
# embedded `default_project`/`tournament` metadata on 2026-09-08, name "Metaculus Cup Fall
# 2026", slug metaculus-cup-fall-2026, prize_pool 5000.00, bot_leaderboard_status
# exclude_and_show -- bots may forecast but are excluded from the leaderboard/prizes).
# `tournament enable` requires the numeric ID to string-match --project-id; the slug alone
# (which worked for read-only `questions fetch`) is not accepted there. See docs/M1-NOTES.md.
#
# Entirely separate ledger, artifacts, and logs from config/tournament.yaml (MiniBench) --
# tournament_state.py activation is scoped to one ledger/account/project at a time, so the
# two tournaments run as independent profiles/processes, never sharing storage.
environment: production
metaculus:
  base_url: https://www.metaculus.com/api
  token_env: METACULUS_TOKEN
  tournament:
    id: 33108
    use_sdk_current_id: false
  group_question_mode: unpack_subquestions
  request_timeout_seconds: 30
  request_spacing_seconds: 3.5
  request_jitter_seconds: 1.0
model:
  provider: openrouter
  name: openrouter/openai/gpt-5.6-sol
  api_key_env: OPENROUTER_API_KEY
  temperature: null
  timeout_seconds: 120
  max_output_tokens: 6000
  allowed_tries: 2
retrieval:
  primary:
    provider: asknews
    api_key_env: ASKNEWS_API_KEY
    timeout_seconds: 60
    retries: 0
  fallback:
    provider: exa
    api_key_env: EXA_API_KEY
    timeout_seconds: 60
    retries: 0
  max_queries_per_question: 2
  max_documents_per_query: 8
  freshness_days_default: 30
  retain_raw_responses: true
  replay_saved_research: false
  deduplicate_by:
  - canonical_url
  - content_sha256
  structured_sources_enabled: true
  social:
    provider: xai_x_search
    enabled: false
    api_key_env: XAI_API_KEY
    agent_model: REPLACE_WITH_VERIFIED_GROK_MODEL_NAME
    temperature: 0.0
    timeout_seconds: 60
    account_allowlist_path: /home/cleblanc/projects/whiskeyjack-bot/config/x_accounts.yaml
    allow_open_search: true
    max_agent_calls_per_question: 2
    max_posts_per_call: 25
    est_cost_per_tool_call_usd: 0.005
forecast:
  supported_question_types:
  - binary
  - multiple_choice
  - numeric
  - discrete
  min_probability: 0.001
  max_probability: 0.999
  community_prediction_policy: log_after_forecast_do_not_use_as_input
  replay_saved_model_output: false
  fail_on_stale_research: true
  flag_on_stale_research: true
  prompt_path: /home/cleblanc/projects/whiskeyjack-bot/prompts/forecaster-tournament.md
  prompt_version: 1.2.0
numeric_calibration:
  use_forecasting_tools_standardization: true
  expected_cdf_points: 201
  max_adjacent_pmf: 0.2
  strict_validation: true
  calibration_profile: identity
  conversion_timeout_seconds: 10.0
submission:
  enabled: true
  dry_run: false
  no_submit: false
  require_human_approval: true
  approval_must_match_forecast_hash: true
  verify_by_refetch: true
  post_private_reasoning_comment: true
  block_retry_on_uncertain_result: true
storage:
  # Own subdirectory, not just a differently-named file in data/: the posting guard
  # (tournament_state.py's check_storage) is scoped by the ledger's *parent directory*,
  # not by filename, so sharing data/ with config/tournament.yaml's live MiniBench ledger
  # would collide on its .posting-guard witnesses at activation (found rehearsing this
  # profile, 2026-09-08 -- see docs/M1-NOTES.md).
  sqlite_path: /home/cleblanc/projects/whiskeyjack-bot/data/cup/ledger.sqlite3
  artifact_root: /home/cleblanc/projects/whiskeyjack-bot/data/cup/artifacts
  export_root: /home/cleblanc/projects/whiskeyjack-bot/data/cup/exports
  sqlite_wal: true
  retain_raw_model_output: true
  retain_raw_research: true
logging:
  level: INFO
  format: json
  file: /home/cleblanc/projects/whiskeyjack-bot/data/logs/tournament-cup.jsonl
  redact_secrets: true
  include_provider_costs: true
notify:
  # Operational push alerts (M1-329). The topic URL is a bearer credential -- anyone
  # holding it can push to the operator's device -- so only the variable NAME is here and
  # the value lives in .env, which the unit files pass through with EnvironmentFile=.
  # The name is registered in secret_env_var_names(), so the logging filter scrubs the
  # value everywhere it might otherwise appear.
  enabled: true
  topic_url_env: NTFY_TOPIC_URL
  timeout_seconds: 10.0
run_limits:
  max_questions: 60
  max_cost_usd: 20
  max_parallel_questions: 1
