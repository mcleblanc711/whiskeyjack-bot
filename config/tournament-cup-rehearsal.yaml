# Rehearsal profile for the Metaculus Cup Fall 2026 activation (docs/TOURNAMENT-OPERATIONS.md
# "Rehearsal" section). Targets the official bot-testing sandbox project (32977), NOT the Cup
# itself -- this exercises the real live-posting mechanics (forecast + comment POST, refetch
# verification) cheaply before the Cup's own activation. Separate ledger/artifacts/logs from
# both config/tournament.yaml (MiniBench) and config/tournament-cup.yaml (Cup production).
#
# Budget capped at $5 (operator request, 2026-09-08) to conserve OpenRouter credits pending
# the Metaculus credit grant -- well under the $20 activation ceiling this project allows.
environment: test
metaculus:
  base_url: https://www.metaculus.com/api
  token_env: METACULUS_TOKEN
  tournament:
    id: 32977
    use_sdk_current_id: false
  group_question_mode: unpack_subquestions
  request_timeout_seconds: 30
  request_spacing_seconds: 3.5
  request_jitter_seconds: 1.0
model:
  provider: openrouter
  name: openrouter/openai/gpt-5.6-sol
  api_key_env: OPENROUTER_API_KEY
  temperature: null
  timeout_seconds: 120
  max_output_tokens: 6000
  allowed_tries: 2
retrieval:
  primary:
    provider: asknews
    api_key_env: ASKNEWS_API_KEY
    timeout_seconds: 60
    retries: 0
  fallback:
    provider: exa
    api_key_env: EXA_API_KEY
    timeout_seconds: 60
    retries: 0
  max_queries_per_question: 2
  max_documents_per_query: 8
  freshness_days_default: 30
  retain_raw_responses: true
  replay_saved_research: false
  deduplicate_by:
  - canonical_url
  - content_sha256
  structured_sources_enabled: true
  social:
    provider: xai_x_search
    enabled: false
    api_key_env: XAI_API_KEY
    agent_model: REPLACE_WITH_VERIFIED_GROK_MODEL_NAME
    temperature: 0.0
    timeout_seconds: 60
    account_allowlist_path: /home/cleblanc/projects/whiskeyjack-bot/config/x_accounts.yaml
    allow_open_search: true
    max_agent_calls_per_question: 2
    max_posts_per_call: 25
    est_cost_per_tool_call_usd: 0.005
forecast:
  supported_question_types:
  - binary
  - multiple_choice
  - numeric
  - discrete
  min_probability: 0.001
  max_probability: 0.999
  community_prediction_policy: log_after_forecast_do_not_use_as_input
  replay_saved_model_output: false
  fail_on_stale_research: true
  flag_on_stale_research: true
  prompt_path: /home/cleblanc/projects/whiskeyjack-bot/prompts/forecaster-tournament.md
  prompt_version: 1.2.0
numeric_calibration:
  use_forecasting_tools_standardization: true
  expected_cdf_points: 201
  max_adjacent_pmf: 0.2
  strict_validation: true
  calibration_profile: identity
  conversion_timeout_seconds: 10.0
submission:
  enabled: true
  dry_run: false
  no_submit: false
  require_human_approval: true
  approval_must_match_forecast_hash: true
  verify_by_refetch: true
  post_private_reasoning_comment: true
  block_retry_on_uncertain_result: true
storage:
  # Own subdirectory, not just a differently-named file in data/: the posting guard
  # (tournament_state.py's check_storage) is scoped by the ledger's *parent directory*,
  # not by filename, so sharing data/ with config/tournament.yaml's live MiniBench ledger
  # collides on its .posting-guard witnesses. See data/launch-rehearsal/ for precedent.
  sqlite_path: /home/cleblanc/projects/whiskeyjack-bot/data/cup-rehearsal/ledger.sqlite3
  artifact_root: /home/cleblanc/projects/whiskeyjack-bot/data/cup-rehearsal/artifacts
  export_root: /home/cleblanc/projects/whiskeyjack-bot/data/cup-rehearsal/exports
  sqlite_wal: true
  retain_raw_model_output: true
  retain_raw_research: true
logging:
  level: INFO
  format: json
  file: /home/cleblanc/projects/whiskeyjack-bot/data/logs/tournament-cup-rehearsal.jsonl
  redact_secrets: true
  include_provider_costs: true
run_limits:
  max_questions: 1
  max_cost_usd: 5
  max_parallel_questions: 1
