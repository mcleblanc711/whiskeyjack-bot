# Locale registry for the local-source lens (M1-356, D53).
#
# What this file is: a curated, versioned map from the places a forecasting question can be
# about to the publishers BASED there. Locality is publisher origin, never document language:
# a Persian-language service run from London is `external` to Iran, not `local` (owner,
# 2026-10-16). Its sha256 is recorded on every lens run, so editing it is visible in the
# ledger as a different registry, not a silent reinterpretation.
#
# Fields per locale:
#   code             ISO 3166-1 alpha-2 for a country; COUNTRY-REGION (ISO 3166-2) for a region.
#   parent           a region's country code; a region inherits nothing implicitly.
#   triggers         English names, demonyms, places and institutions. Matched whole-word and
#                    case-insensitively against the question title, group parent title and
#                    resolution criteria. A trigger listed under several locales (a strait, a
#                    shared border) selects every one of them.
#   languages        ISO 639-1 codes of the locale's local-language press.
#   cctlds           country-code TLDs whose hosts count as local publishers.
#   local_domains    publishers and institutions based in the locale. State, semi-official,
#                    independent and opposition outlets alike: NO credibility weighting here.
#   external_domains outlets based outside the locale but aimed at it (exile, diaspora, a
#                    foreign state's language service). `host` or `host/path-prefix`.
#   native_terms     trigger -> the local name of that place or institution, used to build a
#                    native-language query. Not a translation of the question.
#
# Deliberately absent: locales whose only language is English and whose press the baseline
# already reaches (the United States, the United Kingdom). A lens there buys nothing the
# baseline does not, so a question about them triggers no lens call.

schema_version: 1
locales:
  - code: IR
    triggers: [Iran, Iranian, Iranians, Tehran, Islamic Republic, IRGC, Revolutionary Guard,
               Revolutionary Guards, Khamenei, Pezeshkian, Majlis, Strait of Hormuz, Hormuz,
               Gulf of Oman, Persian Gulf, Bandar Abbas, Isfahan, Natanz, Fordow]
    languages: [fa]
    cctlds: [ir]
    local_domains: [irna.ir, isna.ir, mehrnews.com, tasnimnews.com, farsnews.ir,
                    tehrantimes.com, presstv.ir, president.ir, khamenei.ir, leader.ir,
                    defapress.ir, snn.ir, tabnak.ir, hamshahrionline.ir, khabaronline.ir,
                    entekhab.ir, iribnews.ir]
    external_domains: [iranintl.com, radiofarda.com, bbc.com/persian, iranwire.com,
                       manototv.com]
    native_terms:
      Iran: ایران
      Iranian: ایران
      Tehran: تهران
      Strait of Hormuz: تنگه هرمز
      Hormuz: هرمز
      IRGC: سپاه پاسداران
